name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy budget-bot
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Validate required environment variables
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          ADMIN_USER_ID: ${{ secrets.ADMIN_USER_ID }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL }}
        run: |
          set -e

          required_vars=(
            BOT_TOKEN
            GOOGLE_SERVICE_ACCOUNT_EMAIL
            GOOGLE_PRIVATE_KEY
            ADMIN_USER_ID
            LOG_LEVEL
          )

          for var in "${required_vars[@]}"; do
            if [ -z "${!var}" ]; then
              echo "$var is not set"
              exit 1
            fi
          done

          [[ "$ADMIN_USER_ID" =~ ^[0-9]+$ ]] || { echo "ADMIN_USER_ID must be a positive integer"; exit 1; }

          case "$LOG_LEVEL" in
            fatal|error|warn|info|debug|trace) ;;
            *) echo "LOG_LEVEL has invalid value"; exit 1 ;;
          esac

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            export PATH="/home/work/.yarn/bin:/home/linuxbrew/.linuxbrew/opt/node@24/bin:/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

            # Записываем .env из GitHub Secrets (перезаписывается при каждом деплое).
            # GOOGLE_PRIVATE_KEY: хранить в GitHub Secret как одну строку с \n литералами
            # (формат как в .env.example). node --env-file корректно разворачивает \n → реальные переносы.
            cat > /home/work/projects/budget-bot/.env << 'ENVEOF'
            BOT_TOKEN=${{ secrets.BOT_TOKEN }}
            GOOGLE_SERVICE_ACCOUNT_EMAIL=${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
            GOOGLE_PRIVATE_KEY=${{ secrets.GOOGLE_PRIVATE_KEY }}
            ADMIN_USER_ID=${{ secrets.ADMIN_USER_ID }}
            LOG_LEVEL=${{ vars.LOG_LEVEL }}
            ENVEOF
            chmod 600 /home/work/projects/budget-bot/.env

            bash /home/work/projects/budget-bot/scripts/deploy.sh
